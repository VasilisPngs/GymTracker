<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GymTracker</title>
<meta name="description" content="Private hypertrophy training log with offline-first sync.">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTracker">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="/" data-link>
      <img class="brand-mark" src="/icons/icon.svg" alt="" width="26" height="26">
      <span class="brand-name">GymTracker</span>
    </a>
    <button id="sync-pill" class="pill" type="button" aria-live="polite">Synced</button>
  </header>
  <main id="view" class="view"></main>
  <div id="timer-bar" class="timer-bar" hidden></div>
  <nav class="tabbar">
    <a class="tab" href="/" data-link data-route="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12h17M7 7.5v9M17 7.5v9M4.5 9.5v5M19.5 9.5v5"/></svg>
      <span>Workout</span>
    </a>
    <a class="tab" href="/stats" data-link data-route="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M7.5 15v-5M12 15v-9M16.5 15v-3"/></svg>
      <span>Stats</span>
    </a>
    <a class="tab" href="/settings" data-link data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.47Q9.92 5.21 9.98 4.31L10.01 3.8Q10.07 2.9 10.97 2.9L13.03 2.9Q13.93 2.9 13.99 3.8L14.02 4.31Q14.08 5.21 14.7 5.47L14.7 5.47Q15.33 5.73 16.01 5.14L16.39 4.8Q17.07 4.2 17.7 4.84L19.16 6.3Q19.8 6.93 19.2 7.61L18.86 7.99Q18.27 8.67 18.53 9.3L18.53 9.3Q18.79 9.92 19.69 9.98L20.2 10.01Q21.1 10.07 21.1 10.97L21.1 13.03Q21.1 13.93 20.2 13.99L19.69 14.02Q18.79 14.08 18.53 14.7L18.53 14.7Q18.27 15.33 18.86 16.01L19.2 16.39Q19.8 17.07 19.16 17.7L17.7 19.16Q17.07 19.8 16.39 19.2L16.01 18.86Q15.33 18.27 14.7 18.53L14.7 18.53Q14.08 18.79 14.02 19.69L13.99 20.2Q13.93 21.1 13.03 21.1L10.97 21.1Q10.07 21.1 10.01 20.2L9.98 19.69Q9.92 18.79 9.3 18.53L9.3 18.53Q8.67 18.27 7.99 18.86L7.61 19.2Q6.93 19.8 6.3 19.16L4.84 17.7Q4.2 17.07 4.8 16.39L5.14 16.01Q5.73 15.33 5.47 14.7L5.47 14.7Q5.21 14.08 4.31 14.02L3.8 13.99Q2.9 13.93 2.9 13.03L2.9 10.97Q2.9 10.07 3.8 10.01L4.31 9.98Q5.21 9.92 5.47 9.3L5.47 9.3Q5.73 8.67 5.14 7.99L4.8 7.61Q4.2 6.93 4.84 6.3L6.3 4.84Q6.93 4.2 7.61 4.8L7.99 5.14Q8.67 5.73 9.3 5.47Z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
<div id="sheet-host"></div>
<div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
<script type="module" src="/app/report.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>
