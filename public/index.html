<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GymTracker</title>
<meta name="description" content="Private hypertrophy training log with offline-first sync.">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTracker">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="/" data-link>
      <img class="brand-mark" src="/icons/icon.svg" alt="" width="26" height="26">
      <span class="brand-name">GymTracker</span>
    </a>
    <button id="sync-pill" class="pill" type="button" aria-live="polite">Synced</button>
  </header>
  <main id="view" class="view"></main>
  <div id="timer-bar" class="timer-bar" hidden></div>
  <nav class="tabbar">
    <a class="tab" href="/" data-link data-route="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12h17M7 6v12M17 6v12M4.5 8.5v7M19.5 8.5v7"/></svg>
      <span>Workout</span>
    </a>
    <a class="tab" href="/history" data-link data-route="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 8.9M4.5 4.6v4.3h4.3M12 8.2V12l2.7 1.8"/></svg>
      <span>History</span>
    </a>
    <a class="tab" href="/stats" data-link data-route="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7.5 16v-6M12 16v-11M16.5 16v-4"/></svg>
      <span>Stats</span>
    </a>
    <a class="tab" href="/settings" data-link data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.56 6.11Q10.13 5.88 10.18 5.08L10.21 4.58Q10.25 3.78 11.05 3.78L12.95 3.78Q13.75 3.78 13.79 4.58L13.82 5.08Q13.87 5.88 14.44 6.11L14.44 6.11Q15 6.35 15.6 5.82L15.98 5.49Q16.57 4.96 17.14 5.52L18.48 6.86Q19.04 7.43 18.51 8.02L18.18 8.4Q17.65 9 17.89 9.56L17.89 9.56Q18.12 10.13 18.92 10.18L19.42 10.21Q20.22 10.25 20.22 11.05L20.22 12.95Q20.22 13.75 19.42 13.79L18.92 13.82Q18.12 13.87 17.89 14.44L17.89 14.44Q17.65 15 18.18 15.6L18.51 15.98Q19.04 16.57 18.48 17.14L17.14 18.48Q16.57 19.04 15.98 18.51L15.6 18.18Q15 17.65 14.44 17.89L14.44 17.89Q13.87 18.12 13.82 18.92L13.79 19.42Q13.75 20.22 12.95 20.22L11.05 20.22Q10.25 20.22 10.21 19.42L10.18 18.92Q10.13 18.12 9.56 17.89L9.56 17.89Q9 17.65 8.4 18.18L8.02 18.51Q7.43 19.04 6.86 18.48L5.52 17.14Q4.96 16.57 5.49 15.98L5.82 15.6Q6.35 15 6.11 14.44L6.11 14.44Q5.88 13.87 5.08 13.82L4.58 13.79Q3.78 13.75 3.78 12.95L3.78 11.05Q3.78 10.25 4.58 10.21L5.08 10.18Q5.88 10.13 6.11 9.56L6.11 9.56Q6.35 9 5.82 8.4L5.49 8.02Q4.96 7.43 5.52 6.86L6.86 5.52Q7.43 4.96 8.02 5.49L8.4 5.82Q9 6.35 9.56 6.11Z"/><circle cx="12" cy="12" r="2.4"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
<div id="sheet-host"></div>
<div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
<script type="module" src="/app/report.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>
